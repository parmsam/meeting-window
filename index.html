<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Window</title>
  <meta name="description" content="Find the overlapping business hours between two cities worldwide.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Meeting Window",
    "url": "https://parmsam.github.io/meeting-window/",
    "description": "Find overlapping business hours (8 AM–5 PM) between two or more cities worldwide. Supports shareable URLs and multi-city comparison.",
    "applicationCategory": "Productivity",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0" }
  }
  </script>
  <script>
    // Apply stored theme before paint to avoid flash
    (function() { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; })();
  </script>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-actions">
        <a href="https://github.com/parmsam/meeting-window" target="_blank" rel="noopener" id="github-link" title="View on GitHub" aria-label="View source on GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
          </svg>
        </a>
        <button id="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
      </div>
      <h1>Meeting Window</h1>
      <p class="tagline">Find overlapping business hours between cities</p>
    </header>

    <main>
      <div class="pickers">
        <div class="picker">
          <label for="input-a">Your city</label>
          <input type="text" id="input-a" placeholder="e.g. New York" autocomplete="off" spellcheck="false">
          <ul class="picker-list" id="list-a" hidden></ul>
        </div>

        <button id="swap-btn" title="Swap cities">⇄</button>

        <div class="picker">
          <label for="input-b">Their city</label>
          <input type="text" id="input-b" placeholder="e.g. Tokyo" autocomplete="off" spellcheck="false">
          <ul class="picker-list" id="list-b" hidden></ul>
        </div>
      </div>

      <div id="extra-pickers"></div>

      <div class="picker-footer">
        <button id="add-city-btn" class="add-city-btn">+ Add city</button>
      </div>

      <div class="settings-row">
        <div class="settings-group">
          <label class="settings-lbl" for="date-input">Date</label>
          <div class="date-wrap">
            <input type="date" id="date-input">
            <button id="today-btn" class="today-btn">Today</button>
          </div>
        </div>
        <div class="settings-group">
          <label class="settings-lbl">Business hours</label>
          <div class="hours-wrap">
            <select id="work-start-select" class="hour-select"></select>
            <span class="hours-dash">–</span>
            <select id="work-end-select" class="hour-select"></select>
          </div>
        </div>
      </div>

      <div class="view-toggle" id="view-toggle">
        <button class="view-btn active" data-mode="full">Full</button>
        <button class="view-btn"        data-mode="simple">Simple</button>
      </div>

      <div id="result">
        <p class="hint">Select both cities to find the meeting window.</p>
      </div>
    </main>

    <footer>
      <a href="https://github.com/parmsam/meeting-window" target="_blank" rel="noopener">GitHub</a>
      &middot; Updates every minute
    </footer>
  </div>

  <script src="cities.js"></script>
  <script src="app.js"></script>
</body>
</html>
